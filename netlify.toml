[build]
  command = "npx prisma generate && next build"
  publish = ".next"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client"]
  included_files = [
    "node_modules/.prisma/client/**",
    "prisma/schema.prisma",
    ".env",
    ".env.production",
    ".env.local"
  ]

[[plugins]]
  package = "@netlify/plugin-nextjs"

